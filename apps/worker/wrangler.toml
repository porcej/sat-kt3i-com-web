name = "sat-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
# Soft / hard TTL minutes (documented in README)
SOFT_TTL_MINUTES = "120"
HARD_TTL_MINUTES = "720"

[[kv_namespaces]]
binding = "TLE_KV"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID"

[triggers]
crons = ["0 */4 * * *"]

[observability]
enabled = true
